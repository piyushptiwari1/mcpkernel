apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mcpkernel.fullname" . }}
  labels:
    {{- include "mcpkernel.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "mcpkernel.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/policies: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "mcpkernel.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "mcpkernel.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: mcpkernel
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["serve", "--host", "0.0.0.0", "--port", "8080", "--log-level", "{{ .Values.config.logLevel }}"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: MCPKERNEL_POLICY__HOT_RELOAD
              value: {{ .Values.config.policy.hotReload | quote }}
            - name: MCPKERNEL_DEE__REQUIRE_SIGN
              value: {{ .Values.config.dee.requireSign | quote }}
            {{- if .Values.existingSecret }}
            - name: MCPKERNEL_HEALTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: health-token
                  optional: true
            - name: SIGSTORE_ID_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: sigstore-id-token
                  optional: true
            {{- else if .Values.config.health.token }}
            - name: MCPKERNEL_HEALTH_TOKEN
              value: {{ .Values.config.health.token | quote }}
            {{- end }}
            {{- with .Values.config.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: policies
              mountPath: /etc/mcpkernel/policies
              readOnly: true
            - name: tmp
              mountPath: /tmp
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        {{- with .Values.extraContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      volumes:
        - name: policies
          configMap:
            name: {{ include "mcpkernel.fullname" . }}-policies
        - name: tmp
          emptyDir: {}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
