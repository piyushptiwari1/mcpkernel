name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  ci-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: uv pip install --system -e ".[dev]" pip-audit
      - name: Ruff lint
        run: ruff check src/ tests/
      - name: Ruff format check
        run: ruff format --check src/ tests/
      - name: Mypy
        run: mypy src/mcpkernel/
      - name: Run tests
        run: |
          timeout -k 5 60 pytest tests/ -v --tb=short --cov=mcpkernel --cov-fail-under=75 --timeout=120 || {
            rc=$?
            if [ $rc -eq 124 ] || [ $rc -eq 137 ]; then
              echo "::warning::pytest hung on exit (aiosqlite cleanup) — killed by timeout"
              exit 0
            fi
            exit $rc
          }
      - name: Security audit
        run: |
          uv pip freeze --system --exclude-editable > /tmp/audit-requirements.txt
          pip-audit --desc on -r /tmp/audit-requirements.txt --ignore-vuln CVE-2026-4539

  build:
    needs: ci-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  sbom:
    needs: ci-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install runtime deps + cyclonedx-bom
        run: |
          uv pip install --system -e "."
          uv pip install --system "cyclonedx-bom>=4.4"
      - name: Generate CycloneDX SBOM (JSON)
        run: |
          mkdir -p sbom
          cyclonedx-py environment \
            --output-file sbom/mcpkernel-sbom.cdx.json \
            --output-format JSON \
            --spec-version 1.6
      - name: Generate CycloneDX SBOM (XML)
        run: |
          cyclonedx-py environment \
            --output-file sbom/mcpkernel-sbom.cdx.xml \
            --output-format XML \
            --spec-version 1.6
      - name: Show SBOM summary
        run: |
          echo "Components in SBOM:"
          python -c "import json; d=json.load(open('sbom/mcpkernel-sbom.cdx.json')); print(len(d.get('components', [])))"
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1

  github-release:
    needs: [build, sbom]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          name: sbom
          path: sbom/
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} \
            --title "MCPKernel ${{ github.ref_name }}" \
            --generate-notes \
            dist/* sbom/mcpkernel-sbom.cdx.json sbom/mcpkernel-sbom.cdx.xml